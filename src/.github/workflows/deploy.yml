name: Deploy QRScan Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: qrscan-site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy QRScan over SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m

          script: |
            set -e

            APP_DIR="/var/www/qrscan-site"

            echo "===> Go to app directory"
            cd "$APP_DIR"

            echo "===> Pull latest code"
            git pull origin main

            echo "===> Install dependencies and generate config"
            npm install
            node generate-config.js

            echo "===> Reload nginx"
            sudo systemctl reload nginx

            echo "===> Test site"
            curl -I https://qr.balady-gav-sa.com/

            echo "✅ QRScan deployment completed"
