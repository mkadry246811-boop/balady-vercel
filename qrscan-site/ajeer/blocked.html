<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#dc2626">
    <title>الشهادة موقوفة - نظام أجير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe0e0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow:
                0 20px 60px rgba(220, 38, 38, 0.12),
                0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
            border: 1px solid rgba(220, 38, 38, 0.08);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Top Banner */
        .top-banner {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            padding: 6px 16px;
            text-align: center;
        }

        .top-banner span {
            color: white;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-body {
            padding: 40px 36px 36px;
            text-align: center;
        }

        /* Lock Icon */
        .lock-icon {
            font-size: 72px;
            display: block;
            margin-bottom: 20px;
            animation: shake 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        @keyframes shake {
            0%, 85%, 100% { transform: rotate(0deg); }
            88% { transform: rotate(-6deg); }
            92% { transform: rotate(6deg); }
            96% { transform: rotate(-3deg); }
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #dc2626;
            margin-bottom: 18px;
        }

        /* Reason Box */
        .reason-box {
            background: #fff5f5;
            border: 1.5px solid #fecaca;
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .reason-box p {
            font-size: 15px;
            font-weight: 600;
            color: #1f2937;
            line-height: 1.7;
        }

        .reason-box p span {
            color: #dc2626;
            font-weight: 800;
        }

        /* Contact Info */
        .contact-section {
            margin-bottom: 24px;
        }

        .contact-label {
            font-size: 14px;
            color: #6b7280;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phone-number {
            font-size: 24px;
            font-weight: 800;
            color: #111827;
            letter-spacing: 1px;
            direction: ltr;
            display: block;
            margin-bottom: 4px;
        }

        /* WhatsApp Button */
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: white;
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            font-size: 17px;
            font-weight: 700;
            padding: 14px 32px;
            border-radius: 50px;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow:
                0 8px 24px rgba(37, 211, 102, 0.35),
                0 2px 8px rgba(37, 211, 102, 0.2);
            border: none;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .whatsapp-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow:
                0 12px 32px rgba(37, 211, 102, 0.45),
                0 4px 12px rgba(37, 211, 102, 0.25);
            color: white;
        }

        .whatsapp-btn:active {
            transform: translateY(-1px) scale(0.98);
            color: white;
        }

        .whatsapp-btn i {
            font-size: 22px;
        }

        /* Countdown Box */
        .countdown-box {
            background: #f8fafc;
            border: 1.5px solid #e5e7eb;
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .countdown-box p {
            font-size: 14px;
            color: #6b7280;
            font-weight: 600;
        }

        .countdown-badge {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            font-size: 16px;
            font-weight: 800;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: countPulse 1s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes countPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            50% { transform: scale(1.08); box-shadow: 0 0 0 6px rgba(220, 38, 38, 0); }
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .card-body {
                padding: 32px 24px 28px;
            }

            .lock-icon {
                font-size: 60px;
            }

            h1 {
                font-size: 22px;
            }

            .phone-number {
                font-size: 20px;
            }

            .whatsapp-btn {
                font-size: 15px;
                padding: 13px 24px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top-banner">
            <span>⚠️ تنبيه هام</span>
        </div>

        <div class="card-body">
            <!-- Lock Icon -->
            <span class="lock-icon">🔒</span>

            <h1>الشهادة مغلقة</h1>

            <!-- Reason -->
            <div class="reason-box">
                <p>
                    تم إيقاف هذه الشهادة <span>لعدم سداد المستحقات المالية.</span>
                </p>
            </div>

            <!-- Contact Info -->
            <div class="contact-section">
                <p class="contact-label">يرجى التواصل مع الوكيل على رقم واتساب:</p>
                <span class="phone-number" id="whatsapp-number">01143019264</span>
            </div>

            <!-- WhatsApp Button -->
            <a class="whatsapp-btn" id="whatsapp-link" href="#" target="_blank">
                <i class="bi bi-whatsapp"></i>
                تواصل عبر واتساب
            </a>

            <!-- Countdown -->
            <div class="countdown-box">
                <p>سيتم تحويلك تلقائياً إلى واتساب خلال</p>
                <div class="countdown-badge" id="countdown-num">10</div>
                <p>ثواني</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // Configuration - غيّر هذه البيانات فقط
        // ============================================================
        const WHATSAPP_NUMBER = '201143019264'; // رقم واتساب بصيغة دولية (بدون +)
        const WHATSAPP_DISPLAY = '01143019264'; // الرقم كما يظهر للمستخدم
        const WHATSAPP_MESSAGE = 'السلام عليكم، أرغب في الاستفسار عن إيقاف الشهادة وسداد المستحقات.';
        // ============================================================

        // Set WhatsApp link
        const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(WHATSAPP_MESSAGE)}`;
        const whatsappLink = document.getElementById('whatsapp-link');
        const whatsappNumber = document.getElementById('whatsapp-number');

        whatsappLink.href = waUrl;
        whatsappNumber.textContent = WHATSAPP_DISPLAY;

        // Countdown & Auto-redirect
        let seconds = 10;
        const countdownEl = document.getElementById('countdown-num');

        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = waUrl;
            }
        }, 1000);

        // If user clicks button manually, cancel auto-redirect
        whatsappLink.addEventListener('click', () => {
            clearInterval(timer);
            countdownEl.closest('.countdown-box').style.opacity = '0.4';
        });
    </script>
</body>

</html>
