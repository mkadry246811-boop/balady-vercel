    <script>
        // Greeting based on time of day
        function setGreeting() {
            const hour = new Date().getHours();
            const greetingEl = document.getElementById('greetingMessage');
            const iconEl = greetingEl.querySelector('.greeting-icon');
            const textEl = greetingEl.querySelector('.greeting-text');

            let greeting, icon, className;

            if (hour >= 5 && hour < 12) {
                // Morning (5 AM - 12 PM)
                greeting = 'صباح الخير';
                icon = '☀️';
                className = 'morning';
            } else if (hour >= 12 && hour < 17) {
                // Afternoon (12 PM - 5 PM)
                greeting = 'مساء الورد';
                icon = '🌸';
                className = 'evening';
            } else if (hour >= 17 && hour < 21) {
                // Evening (5 PM - 9 PM)
                greeting = 'مساء الورد';
                icon = '🌹';
                className = 'evening';
            } else {
                // Night (9 PM - 5 AM)
                greeting = 'مساء النور';
                icon = '🌙';
                className = 'night';
            }

            iconEl.textContent = icon;
            textEl.textContent = greeting;
            // greetingEl.className = 'greeting-message mb-2 ' + className; 
        }

        document.addEventListener('DOMContentLoaded', () => {
            setGreeting();
            loadDashboard();

            // Search Filter with debounce
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(applyFilters, 300);
            });

            // Type Filter
            document.getElementById('filterType').addEventListener('change', () => {
                applyFilters();
            });

            // Navbar scroll effect
            window.addEventListener('scroll', () => {
                const navbar = document.querySelector('.navbar');
                if (window.scrollY > 10) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });

            // Handle window resize
            window.addEventListener('resize', () => {
                // applyFilters(); 
            });
        });

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const typeFilter = document.getElementById('filterType').value;
            renderCards(searchTerm, typeFilter);
        }

        async function loadDashboard() {
            await renderCards();
            await updateStats();
        }

        async function renderCards(searchTerm = '', typeFilter = '') {
            const contracts = await StorageManager.getContracts();
            const grid = document.getElementById('contractsGrid');
            const emptyState = document.getElementById('emptyState');

            grid.innerHTML = '';

            const filtered = contracts.filter(c => {
                const matchesSearch = !searchTerm ||
                    (c.workerName && c.workerName.toLowerCase().includes(searchTerm)) ||
                    (c.workerIdNumber && c.workerIdNumber.toLowerCase().includes(searchTerm));
                const contractType = c.contractType || 'تعاقد أجير';
                const matchesType = !typeFilter || contractType === typeFilter;
                return matchesSearch && matchesType;
            });

            if (filtered.length === 0) {
                grid.classList.add('d-none');
                emptyState.classList.remove('d-none');
                return;
            }

            grid.classList.remove('d-none');
            emptyState.classList.add('d-none');

            filtered.forEach((contract, index) => {
                const isBlocked = contract.isBlocked || false;
                const contractType = contract.contractType || 'تعاقد أجير';
                const isAjeer = contractType === 'تعاقد أجير';

                // Color Themes
                const themeColor = isAjeer ? 'primary' : 'info';
                const iconClass = isAjeer ? 'bi-file-earmark-text' : 'bi-arrow-left-right';

                const col = document.createElement('div');
                col.className = 'col-12 col-md-6 col-lg-4 d-flex pb-4';
                col.style.animation = `fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) ${index * 0.1}s forwards`;
                col.style.opacity = '0';

                col.innerHTML = `
                    <div class="card elite-card w-100 border-0">
                        <div class="card-inner">
                            
                            <!-- Header: Badges -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <span class="elite-badge bg-${themeColor}-soft text-${themeColor}">
                                    ${contractType}
                                </span>
                                ${isBlocked
                        ? '<span class="elite-badge bg-danger-soft text-danger">موقوف</span>'
                        : '<span class="elite-badge bg-success-soft text-success">نشط</span>'
                    }
                            </div>

                            <!-- Identity: Centered & Sophisticated -->
                            <div class="text-center mb-5">
                                <div class="avatar-wrapper">
                                    <div class="avatar-ring"></div>
                                    <div class="avatar avatar-xl bg-white rounded-circle d-flex align-items-center justify-content-center mx-auto shadow-sm" style="width: 100%; height: 100%; border: 6px solid #f8fafc;">
                                        <i class="bi bi-person-fill text-slate-300" style="font-size: 3.5rem;"></i>
                                    </div>
                                    ${!isBlocked ? '<div class="position-absolute translate-middle p-1 bg-white rounded-circle shadow border" style="bottom: 5%; left: 15%; width: 32px; height: 32px; z-index: 2;"><i class="bi bi-patch-check-fill text-primary" style="font-size: 20px; position: relative; top: -5px;"></i></div>' : ''}
                                </div>
                                
                                <h4 class="fw-bold text-slate-900 mb-2" style="font-size: 1.5rem; letter-spacing: -0.02em;">${contract.workerName || '-'}</h4>
                                <span class="elite-id-badge">
                                    <i class="bi bi-hash me-1"></i>${contract.contractNumber || '-'}
                                </span>
                            </div>

                            <!-- Data Grid: Modular & Clean -->
                            <div class="info-grid">
                                <div class="info-item">
                                    <div class="info-icon">
                                        <i class="bi bi-building"></i>
                                    </div>
                                    <div class="overflow-hidden">
                                        <small class="d-block text-slate-400 fw-bold mb-1" style="font-size: 0.65rem; text-transform: uppercase;">المنشأة المستفيدة</small>
                                        <div class="fw-bold text-slate-800 text-truncate">${contract.beneficiaryEntity || '-'}</div>
                                    </div>
                                </div>

                                <div class="d-flex gap-3 mt-1">
                                    <div class="info-item flex-grow-1 mb-0 p-3">
                                        <div class="text-center w-100">
                                            <small class="d-block text-slate-400 fw-bold mb-1" style="font-size: 0.65rem;">بداية العقد</small>
                                            <div class="fw-bold text-slate-700 small">${formatDate(contract.startDate)}</div>
                                        </div>
                                    </div>
                                    <div class="info-item flex-grow-1 mb-0 p-3">
                                        <div class="text-center w-100">
                                            <small class="d-block text-slate-400 fw-bold mb-1" style="font-size: 0.65rem;">نهاية العقد</small>
                                            <div class="fw-bold text-slate-700 small">${formatDate(contract.endDate)}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Actions: Elite Focal Point & Micro-Actions -->
                            <div class="d-flex flex-column gap-3 mt-4">
                                <a href="/ajeer/contract.html?id=${contract.id}" class="btn elite-action-btn d-flex align-items-center justify-content-center gap-2">
                                    <span>مشاهدة تفاصيل العقد كاملة</span>
                                    <i class="bi bi-arrow-left"></i>
                                </a>
                                
                                <div class="d-flex justify-content-center gap-3">
                                    <a href="/ajeer/form.html?id=${contract.id}" class="micro-btn micro-btn-blue shadow-sm" data-bs-toggle="tooltip" title="تعديل البيانات">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    
                                    <button onclick="toggleBlock('${contract.id}', ${isBlocked})" class="micro-btn ${isBlocked ? 'micro-btn-emerald' : 'micro-btn-amber'} shadow-sm" data-bs-toggle="tooltip" title="${isBlocked ? 'تفعيل' : 'إيقاف'}">
                                        <i class="bi ${isBlocked ? 'bi-unlock' : 'bi-lock'}"></i>
                                    </button>
                                    
                                    <button onclick="confirmDelete('${contract.id}')" class="micro-btn micro-btn-rose shadow-sm" data-bs-toggle="tooltip" title="حذف نهائي">
                                        <i class="bi bi-trash3"></i>
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>
                `;
                grid.appendChild(col);

                // Initialize tooltips
                const cardTooltips = col.querySelectorAll('[data-bs-toggle="tooltip"]');
                [...cardTooltips].forEach(title => new bootstrap.Tooltip(title));
            });
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const Toast = Swal.mixin({
                    toast: true,
                    position: 'bottom-end',
                    showConfirmButton: false,
                    timer: 2000,
                    timerProgressBar: false
                });
                Toast.fire({
                    icon: 'success',
                    title: 'تم نسخ رقم العقد'
                });
            });
        }

        async function updateStats() {
            const contracts = await StorageManager.getContracts();
            const total = contracts.length;
            const active = contracts.filter(c => !c.isBlocked).length;

            let ajeerCount = 0;
            let loanCount = 0;

            contracts.forEach(c => {
                const type = c.contractType || 'تعاقد أجير';
                if (type === 'تعاقد أجير') {
                    ajeerCount++;
                } else if (type === 'إعارة' || type === 'تعاقد إعارة' || type === 'استعارة') {
                    loanCount++;
                }
            });

            // Animate numbers
            animateValue('stat-total', 0, total, 500);
            animateValue('stat-active', 0, active, 500);
            animateValue('stat-ajeer', 0, ajeerCount, 500);
            animateValue('stat-loan', 0, loanCount, 500);
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            const range = end - start;
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                obj.textContent = Math.floor(start + range * easeOut);

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            requestAnimationFrame(update);
        }

        async function toggleBlock(id, currentBlockState) {
            const action = currentBlockState ? 'تفعيل' : 'إيقاف';

            try {
                const contract = await StorageManager.getContract(id);
                contract.isBlocked = !currentBlockState;

                await StorageManager.saveContract(contract);
                await loadDashboard();

                Swal.fire({
                    icon: 'success',
                    title: `تم ${action} العقد`,
                    showConfirmButton: false,
                    timer: 1500
                });
            } catch (error) {
                Swal.fire('خطأ', 'حدث خطأ أثناء تحديث العقد', 'error');
            }
        }

        async function confirmDelete(id) {
            Swal.fire({
                title: 'هل أنت متأكد؟',
                text: "لن تتمكن من التراجع عن هذا!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: '<i class="bi bi-trash ms-1"></i> نعم، حذف',
                cancelButtonText: '<i class="bi bi-x-lg ms-1"></i> إلغاء'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await StorageManager.deleteContract(id);
                    await loadDashboard();
                    Swal.fire({
                        icon: 'success',
                        title: 'تم الحذف!',
                        text: 'تم حذف العقد بنجاح.',
                        showConfirmButton: false,
                        timer: 1500
                    });
                }
            });
        }

        async function backupContracts() {
            const btn = document.getElementById('backupBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span> جاري التصدير...';

            try {
                const result = await StorageManager.backupDatabase();

                if (result.cancelled) {
                    // User closed the Save As dialog - do nothing
                    return;
                }

                Swal.fire({
                    icon: 'success',
                    title: 'تم التصدير بنجاح!',
                    html: `تم حفظ النسخة الاحتياطية تحتوي على <strong>${result.count}</strong> عقد.<br><small class="text-muted">${result.filename}</small>`,
                    confirmButtonText: 'حسناً',
                    confirmButtonColor: '#0d6efd'
                });
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ في التصدير',
                    text: 'حدث خطأ أثناء إنشاء النسخة الاحتياطية. الرجاء المحاولة مجدداً.',
                    confirmButtonColor: '#0d6efd'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-cloud-arrow-down"></i> <span>نسخ احتياطي</span>';
            }
        }
        async function importContracts() {
            const confirm = await Swal.fire({
                title: 'استيراد البيانات',
                html: 'سيتم استيراد العقود من ملف النسخة الاحتياطية.<br><small class="text-muted">العقود الموجودة مسبقاً لن تتكرر وسيتم تخطيها.</small>',
                icon: 'info',
                showCancelButton: true,
                confirmButtonText: 'اختر الملف',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: '#198754'
            });

            if (!confirm.isConfirmed) return;

            const btn = document.getElementById('importBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span> جاري الاستيراد...';

            try {
                const result = await StorageManager.importDatabase();
                await loadDashboard();
                Swal.fire({
                    icon: 'success',
                    title: 'تم الاستيراد بنجاح!',
                    html: `تم إضافة <strong>${result.imported}</strong> عقد جديد.<br>تم تخطي <strong>${result.skipped}</strong> عقد موجودة مسبقاً.`,
                    confirmButtonColor: '#198754'
                });
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ في الاستيراد',
                    text: error.message || 'حدث خطأ أثناء قراءة الملف.',
                    confirmButtonColor: '#0d6efd'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-cloud-arrow-up"></i> <span>استيراد</span>';
            }
        }
